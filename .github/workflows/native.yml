name: Native app

# Builds the Rust desktop app for macOS, Windows and Linux and packages it.
# Every push to main that touches  builds and keeps the packages as run
# artifacts; pushing a version tag also publishes them as a GitHub Release
# (a pre-release when the tag has a suffix, like v1.1.0-beta.1):
#
#     git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # One build per architecture, each on its own kind of runner, so Homebrew's
    # libmpv matches the binary. (A universal app would need both libmpvs.)
    strategy:
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libmpv
        run: brew install mpv dylibbundler
      - name: Test
        run: cargo test --workspace --release
      - name: Build Lumen.app and the .dmg
        run: |
          scripts/bundle-macos.sh
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dmg && cp -R target/bundle/Lumen.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Lumen $VERSION" -srcfolder dmg -ov -format UDZO "Lumen-$VERSION-mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: Lumen-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch libmpv
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' -D mpv-dl
          7z x mpv-dl/*.7z -ompv > /dev/null
          ls mpv
      # The dev build ships a MinGW import library; MSVC needs a .lib, which
      # we make from the DLL's own export table.
      - name: Make an import library for MSVC
        shell: bash
        run: |
          dumpbin //exports mpv/libmpv-2.dll | awk '$4 ~ /^mpv_/ {print $4}' > names.txt
          { echo "LIBRARY libmpv-2.dll"; echo "EXPORTS"; cat names.txt; } > mpv/mpv.def
          wc -l names.txt
          lib //nologo //def:mpv/mpv.def //out:mpv/mpv.lib //machine:x64
      # PowerShell, not bash: Git's bash puts its own `link` ahead of MSVC's
      # link.exe on the PATH.
      - name: Build
        shell: pwsh
        env:
          MPV_LIB_DIR: ${{ github.workspace }}\mpv
        run: |
          cargo build --release -p lumen
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --release -p lumen-core -p lumen-discord
      - name: Installer
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p stage && cp target/release/lumen.exe mpv/libmpv-2.dll stage/
          # Chocolatey's download fails now and then; try a few times.
          if ! command -v makensis; then
            for i in 1 2 3; do choco install nsis -y --no-progress && break; sleep 15; done
          fi
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -DVERSION=$VERSION -DSRC="$PWD/stage" -DOUT="$PWD/Lumen-$VERSION-Setup.exe" packaging/windows/lumen.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Lumen-*-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev pkg-config libfuse2 imagemagick
      - name: Test and build
        run: |
          cargo test --workspace --release
          cargo build --release -p lumen
      - name: Package (.deb and AppImage)
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # .deb: the system's libmpv does the playing.
          D=deb/lumen_${VERSION}_amd64
          mkdir -p $D/DEBIAN $D/usr/bin $D/usr/share/applications $D/usr/share/icons/hicolor/512x512/apps
          cp target/release/lumen $D/usr/bin/
          cp packaging/linux/lumen.desktop $D/usr/share/applications/
          convert build/icon.png -resize 512x512 $D/usr/share/icons/hicolor/512x512/apps/lumen.png
          cat > $D/DEBIAN/control <<CTRL
          Package: lumen
          Version: $VERSION
          Architecture: amd64
          Maintainer: wumgub <67914953+wumgub@users.noreply.github.com>
          Depends: libmpv2 | libmpv1, libgtk-3-0, libxkbcommon0, libdbus-1-3
          Conflicts: lumen-player
          Replaces: lumen-player
          Section: sound
          Priority: optional
          Homepage: https://github.com/wumgub/lumen-player
          Description: Music player with reactive visualizers
           A native music player with a scanned library, themes and visualizers.
          CTRL
          dpkg-deb --build --root-owner-group $D "Lumen-$VERSION-linux-amd64.deb"
          # AppImage: libmpv and its libraries come along inside.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            -e target/release/lumen -d packaging/linux/lumen.desktop \
            -i $D/usr/share/icons/hicolor/512x512/apps/lumen.png --output appimage
          mv Lumen-*.AppImage "Lumen-$VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Lumen-*.deb
            Lumen-*.AppImage

  release:
    needs: [mac, windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false
