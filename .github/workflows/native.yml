name: Native app

# Builds the Rust desktop app for macOS, Windows and Linux and packages it.
# Every push to main that touches  builds and keeps the packages as run
# artifacts; pushing a version tag also publishes them as a GitHub Release
# (a pre-release when the tag has a suffix, like v1.1.0-beta.1):
#
#     git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libmpv
        run: brew install mpv dylibbundler
      - name: Test
        run: cargo test --workspace --release
      - name: Build Lumen.app and the .dmg
        run: |
          scripts/bundle-macos.sh
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p dmg && cp -R target/bundle/Lumen.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Lumen $VERSION" -srcfolder dmg -ov -format UDZO "Lumen-$VERSION-mac-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Lumen-*.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Fetch libmpv
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern 'mpv-dev-x86_64-2*.7z' -D mpv-dl
          7z x mpv-dl/*.7z -ompv > /dev/null
          ls mpv
      # The dev build ships a MinGW import library; MSVC needs a .lib, which
      # we make from the DLL's own export table.
      - name: Make an import library for MSVC
        shell: bash
        run: |
          dumpbin //exports mpv/libmpv-2.dll | awk '$4 ~ /^mpv_/ {print $4}' > names.txt
          { echo "LIBRARY libmpv-2.dll"; echo "EXPORTS"; cat names.txt; } > mpv/mpv.def
          wc -l names.txt
          lib //nologo //def:mpv/mpv.def //out:mpv/mpv.lib //machine:x64
      # PowerShell, not bash: Git's bash puts its own `link` ahead of MSVC's
      # link.exe on the PATH.
      - name: Build
        shell: pwsh
        env:
          MPV_LIB_DIR: ${{ github.workspace }}\mpv
        run: |
          cargo build --release -p lumen
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --release -p lumen-core -p lumen-discord
      - name: Installer
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p stage && cp target/release/lumen.exe mpv/libmpv-2.dll stage/
          # Chocolatey's download fails now and then; try a few times.
          if ! command -v makensis; then
            for i in 1 2 3; do choco install nsis -y --no-progress && break; sleep 15; done
          fi
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -DVERSION=$VERSION -DSRC="$PWD/stage" -DOUT="$PWD/Lumen-$VERSION-Setup.exe" packaging/windows/lumen.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Lumen-*-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    # Built on Debian 12 so the binary only needs its older glibc and runs on
    # Debian 12 and 13, Ubuntu 24.04 and newer, Mint and the rest.
    container: debian:12
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl wget git file build-essential \
            pkg-config dpkg-dev imagemagick libmpv-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and build
        run: |
          cargo test --workspace --release
          cargo build --release -p lumen
      - name: Package (.deb and AppImage)
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          # .deb: the system's libmpv does the playing. It also adds Lumen's
          # apt repository, so later versions come with the system's updates.
          D=deb/lumen_${VERSION}_amd64
          mkdir -p $D/DEBIAN $D/usr/bin $D/usr/share/applications $D/usr/share/icons/hicolor/512x512/apps \
            $D/usr/share/keyrings $D/etc/apt/sources.list.d
          cp target/release/lumen $D/usr/bin/
          cp packaging/linux/lumen.desktop $D/usr/share/applications/
          convert build/icon.png -resize 512x512 $D/usr/share/icons/hicolor/512x512/apps/lumen.png
          install -m644 packaging/linux/lumen-archive-keyring.gpg $D/usr/share/keyrings/
          install -m644 packaging/linux/lumen.sources $D/etc/apt/sources.list.d/
          echo /etc/apt/sources.list.d/lumen.sources > $D/DEBIAN/conffiles
          # Work out Depends from the libraries the binary really links, so the
          # package names are right on both sides of Debian's t64 rename.
          mkdir -p shlibs/debian && echo "Source: lumen" > shlibs/debian/control
          DEPENDS=$(cd shlibs && dpkg-shlibdeps -O "../$D/usr/bin/lumen" | sed -n 's/^shlibs:Depends=//p')
          [ -n "$DEPENDS" ] || { echo "dpkg-shlibdeps found no dependencies"; exit 1; }
          # The window, keyboard and OpenGL libraries are loaded at runtime
          # (winit, glutin), so dpkg-shlibdeps can't see them.
          DEPENDS="$DEPENDS, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxrandr2, libxi6"
          DEPENDS="$DEPENDS, libwayland-client0, libwayland-cursor0, libwayland-egl1, libegl1, libgl1"
          echo "Depends: $DEPENDS"
          cat > $D/DEBIAN/control <<CTRL
          Package: lumen
          Version: $VERSION
          Architecture: amd64
          Maintainer: wumgub <67914953+wumgub@users.noreply.github.com>
          Depends: $DEPENDS
          Recommends: xdg-desktop-portal
          Conflicts: lumen-player
          Replaces: lumen-player
          Section: sound
          Priority: optional
          Homepage: https://github.com/wumgub/lumen-player
          Description: Music player with reactive visualizers
           A native music player with a scanned library, themes and visualizers.
          CTRL
          dpkg-deb --build --root-owner-group $D "Lumen-$VERSION-linux-amd64.deb"
          dpkg-deb -I "Lumen-$VERSION-linux-amd64.deb"
          dpkg-deb -c "Lumen-$VERSION-linux-amd64.deb"
          # AppImage: libmpv and its libraries come along inside.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p AppDir
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir \
            -e target/release/lumen -d packaging/linux/lumen.desktop \
            -i $D/usr/share/icons/hicolor/512x512/apps/lumen.png --output appimage
          mv Lumen-*.AppImage "Lumen-$VERSION-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Lumen-*.deb
            Lumen-*.AppImage

  # Install the .deb on each distro it's meant for, on every build.
  deb-check:
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'debian:13', 'ubuntu:24.04']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Install it
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./Lumen-*.deb
          dpkg -s lumen | grep '^Version'
          if ldd /usr/bin/lumen | grep 'not found'; then exit 1; fi
          # The libraries it loads at runtime are there too.
          for lib in libxkbcommon.so.0 libX11.so.6 libwayland-client.so.0 libEGL.so.1 libGL.so.1 libmpv.so.2; do
            ldconfig -p | grep -q "$lib" || { echo "missing $lib"; exit 1; }
          done
          test -f /etc/apt/sources.list.d/lumen.sources
          echo "Lumen installs and links on ${{ matrix.image }}"

  release:
    needs: [mac, windows, linux, deb-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false

  apt:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    uses: ./.github/workflows/apt-repo.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
