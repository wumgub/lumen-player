[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
log = "0.4"
lumen-core = { version = "0.3.0", path = "../crates/lumen-core" }
lumen-discord = { version = "0.3.0", path = "../crates/lumen-discord" }
lumen-playback = { path = "../crates/lumen-playback" }
memmap2 = "0.9"
parking_lot = "0.13"
resvg = { version = "0.49", default-features = false }
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.9"
