[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
lumen-playback = { path = "../crates/lumen-playback" }
memmap2 = "0.9"
parking_lot = "0.13"
rusqlite = { version = "0.41", features = ["bundled"] }
souvlaki = "0.9"
