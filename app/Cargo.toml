[package]
name = "lumen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
log = "0.4"
lumen-core = { path = "../crates/lumen-core" }
lumen-discord = { path = "../crates/lumen-discord" }
lumen-playback = { path = "../crates/lumen-playback" }
memmap2 = "0.9"
parking_lot = "0.13"
raw-window-handle = "0.6"
resvg = { version = "0.49", default-features = false }
rfd = "0.16"
rusty-leveldb = "4.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.9"

[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSToolbar"] }
core-foundation = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
